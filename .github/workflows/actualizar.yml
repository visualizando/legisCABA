name: Actualizar datasets mensualmente
on:
  schedule:
    # Día 2, 06:30 de Buenos Aires; después de la actualización del CSV externo.
    - cron: '30 9 2 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: actualizar-datos-parlamentarios
  cancel-in-progress: false
jobs:
  actualizar:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restaurar snapshots versionados
        run: python tools/package_data.py unpack
      - name: Verificar recolectores y modelos del sitio
        run: |
          python -m unittest discover -s tests -v
          node --test tests/*.test.mjs
      - name: Actualizar todos los datasets operativos
        run: python tools/update_data.py
      - name: Verificar exportaciones actualizadas
        run: node --test tests/*.test.mjs
      - name: Guardar una actualización completa
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/*.gz data/resumen.json site/data/
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar datasets mensuales de forma incremental'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
