name: Actualizar votaciones
on:
  schedule:
    - cron: '30 10 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: actualizar-datos-parlamentarios
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tools/package_data.py unpack
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/votes.test.mjs
      - name: Revisar todo el histórico desde 2016 y sumar o corregir votos
        run: python votes.py
      - name: Comprimir base y exportación
        run: python tools/package_data.py pack
      - name: Guardar datos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/votaciones.sqlite.gz site/data/votaciones.json.gz
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar votaciones nominales'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
